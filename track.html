<!DOCTYPE html>
<html lang="en-PH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="https://thegoldblessing.com/track.html">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="TGB_LOGO.png">
  
  <!-- Primary Meta Tags -->
  <title>Track Your Order | The Gold Blessing</title>
  <meta name="title" content="Track Your Order | The Gold Blessing">
  <meta name="description" content="Track your gold jewelry order from The Gold Blessing. Enter your Order ID to check payment status, shipping updates, and delivery information.">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://thegoldblessing.com/track.html">
  <meta property="og:title" content="Track Your Order | The Gold Blessing">
  <meta property="og:description" content="Track your gold jewelry order status and shipping information.">
  <meta property="og:image" content="https://thegoldblessing.com/TGB_LOGO.png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- TGB System Styles -->
  <link rel="stylesheet" href="css/tgb-system.css">
</head>
<body>
  
  <!-- Navigation -->
  <nav class="tgb-nav">
    <div class="tgb-nav-content">
      <a href="/" class="tgb-nav-logo">
        <img src="TGB_LOGO.png" alt="The Gold Blessing">
        <span>THE GOLD BLESSING</span>
      </a>
      <div class="tgb-nav-links">
        <a href="/">Home</a>
        <a href="/track.html" class="active">Track Order</a>
        <a href="/layaway.html">LayAway</a>
      </div>
      <div class="tgb-mobile-menu" onclick="toggleMobileMenu()">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </nav>
  
  <div class="tgb-page">
    
    <!-- Header -->
    <div class="tgb-header">
      <h1>Track Your Order</h1>
      <p>Enter your Order ID to check your order status</p>
    </div>
    
    <!-- Search Box -->
    <div class="tgb-search-box">
      <input type="text" id="orderIdInput" placeholder="Enter Order ID (e.g., TGB-1234567890)" autocomplete="off">
      <button onclick="trackOrder()">TRACK ORDER</button>
    </div>
    
    <!-- Loading -->
    <div class="tgb-loading" id="loading">
      <div class="tgb-spinner"></div>
      <p>Searching for your order...</p>
    </div>
    
    <!-- Error -->
    <div class="tgb-error" id="error"></div>
    
    <!-- Result -->
    <div class="tgb-result" id="result">
      
      <!-- Status Timeline -->
      <div class="tgb-timeline">
        <div class="tgb-timeline-step" id="step0">
          <div class="step-icon">1</div>
          <div class="step-label">Pending Payment</div>
        </div>
        <div class="tgb-timeline-step" id="step1">
          <div class="step-icon">2</div>
          <div class="step-label">Processing</div>
        </div>
        <div class="tgb-timeline-step" id="step2">
          <div class="step-icon">3</div>
          <div class="step-label">Shipped</div>
        </div>
        <div class="tgb-timeline-step" id="step3">
          <div class="step-icon">4</div>
          <div class="step-label">Delivered</div>
        </div>
      </div>
      
      <!-- Order Info Grid -->
      <div class="tgb-info-grid">
        <div class="tgb-info-item">
          <label>Order ID</label>
          <value id="resultOrderId">-</value>
        </div>
        <div class="tgb-info-item">
          <label>Order Date</label>
          <value id="resultDate">-</value>
        </div>
        <div class="tgb-info-item">
          <label>Receiver</label>
          <value id="resultReceiver">-</value>
        </div>
        <div class="tgb-info-item">
          <label>Contact</label>
          <value id="resultContact">-</value>
        </div>
        <div class="tgb-info-item">
          <label>City</label>
          <value id="resultCity">-</value>
        </div>
        <div class="tgb-info-item">
          <label>Region</label>
          <value id="resultRegion">-</value>
        </div>
        <div class="tgb-info-item">
          <label>Payment Method</label>
          <value id="resultPaymentMethod">-</value>
        </div>
        <div class="tgb-info-item">
          <label>Payment Status</label>
          <value id="resultPaymentStatus">-</value>
        </div>
      </div>
      
      <!-- Tracking Section -->
      <div id="trackingSection" style="display: none; margin-top: 25px; padding: 20px; background: rgba(212, 175, 55, 0.1); border-radius: 10px; border: 1px solid rgba(212, 175, 55, 0.3);">
        <h3 style="color: var(--tgb-gold); margin-bottom: 15px; font-family: 'Playfair Display', serif;">Shipping Information</h3>
        <div class="tgb-info-grid">
          <div class="tgb-info-item">
            <label>Tracking Number</label>
            <value id="resultTrackingNumber">-</value>
          </div>
          <div class="tgb-info-item">
            <label>Courier</label>
            <value>LBC Express</value>
          </div>
        </div>
        <a id="trackingLink" href="#" target="_blank" style="display: inline-block; margin-top: 15px; padding: 12px 25px; background: var(--tgb-gold); color: var(--tgb-deep-green); text-decoration: none; border-radius: 5px; font-weight: 600;">Track with LBC</a>
      </div>
      
      <!-- Invoice Section -->
      <div id="invoiceSection" style="display: none; margin-top: 20px; text-align: center;">
        <a id="invoiceLink" href="#" target="_blank" style="color: var(--tgb-gold); text-decoration: underline;">View Invoice</a>
      </div>
      
    </div>
    
    <!-- Back Link -->
    <div class="tgb-back-link">
      <a href="/">← Back to Homepage</a>
    </div>
    
  </div>
  
  <!-- Load TGB API -->
  <script src="js/tgb-api.js"></script>
  
  <script>
    function trackOrder() {
      var orderId = document.getElementById('orderIdInput').value.trim();
      
      if (!orderId) {
        showError('Please enter your Order ID');
        return;
      }
      
      // Show loading
      document.getElementById('loading').classList.add('show');
      document.getElementById('result').classList.remove('show');
      document.getElementById('error').classList.remove('show');
      
      // Call API using TGB_API object
      TGB_API.trackOrder(orderId)
        .then(function(response) {
          document.getElementById('loading').classList.remove('show');
          
          if (response.success) {
            displayOrder(response.order);
          } else {
            showError(response.error || 'Order not found');
          }
        })
        .catch(function(err) {
          document.getElementById('loading').classList.remove('show');
          showError('Unable to connect. Please try again later.');
          console.error('Track error:', err);
        });
    }
    
    function displayOrder(order) {
      // Update timeline
      var step = order.statusStep || 0;
      for (var i = 0; i <= 3; i++) {
        var stepEl = document.getElementById('step' + i);
        stepEl.classList.remove('active', 'completed');
        if (i < step) {
          stepEl.classList.add('completed');
        } else if (i === step) {
          stepEl.classList.add('active');
        }
      }
      
      // Update info
      document.getElementById('resultOrderId').textContent = order.orderId || '-';
      document.getElementById('resultDate').textContent = order.date || '-';
      document.getElementById('resultReceiver').textContent = order.receiver || '-';
      document.getElementById('resultContact').textContent = order.contactNumber || '-';
      document.getElementById('resultCity').textContent = order.city || '-';
      document.getElementById('resultRegion').textContent = order.region || '-';
      document.getElementById('resultPaymentMethod').textContent = order.paymentMethod || '-';
      document.getElementById('resultPaymentStatus').textContent = order.paymentStatus || '-';
      
      // Tracking section
      var trackingSection = document.getElementById('trackingSection');
      if (order.trackingNumber) {
        document.getElementById('resultTrackingNumber').textContent = order.trackingNumber;
        document.getElementById('trackingLink').href = order.trackingUrl || 'https://www.lbc.com.ph/tracking?tracking_no=' + order.trackingNumber;
        trackingSection.style.display = 'block';
      } else {
        trackingSection.style.display = 'none';
      }
      
      // Invoice section
      var invoiceSection = document.getElementById('invoiceSection');
      if (order.invoiceLink) {
        document.getElementById('invoiceLink').href = order.invoiceLink;
        invoiceSection.style.display = 'block';
      } else {
        invoiceSection.style.display = 'none';
      }
      
      // Show result
      document.getElementById('result').classList.add('show');
    }
    
    function showError(message) {
      document.getElementById('error').textContent = message;
      document.getElementById('error').classList.add('show');
    }
    
    // Enter key support
    document.getElementById('orderIdInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') trackOrder();
    });
    
    // Mobile menu toggle
    function toggleMobileMenu() {
      var links = document.querySelector('.tgb-nav-links');
      if (links.style.display === 'flex') {
        links.style.display = 'none';
      } else {
        links.style.display = 'flex';
        links.style.flexDirection = 'column';
        links.style.position = 'absolute';
        links.style.top = '70px';
        links.style.left = '0';
        links.style.right = '0';
        links.style.background = 'var(--tgb-deep-green)';
        links.style.padding = '20px';
        links.style.borderBottom = '1px solid rgba(212, 175, 55, 0.3)';
      }
    }
  </script>
</body>
</html>
